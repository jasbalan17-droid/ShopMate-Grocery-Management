
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopMate - Smart Grocery Management</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header class="main-header">

        <a href="{{ url_for('home') }}" class="brand">
            <span class="brand-icon">🛒</span>
            <span>
                <strong>Shop<span>Mate</span></strong>
                <small>Smart Shop, Smart Choice</small>
            </span>
        </a>

        <nav class="main-nav">
    <a href="{{ url_for('home') }}">Home</a>
    <a href="{{ url_for('dashboard') }}">Dashboard</a>
    <a href="{{ url_for('products') }}">Products</a>
    <a href="{{ url_for('add_product') }}">Add Product</a>
    <a href="{{ url_for('billing') }}">Billing</a>
    <a href="{{ url_for('bill_history') }}">Bill History</a>
    <a href="{{ url_for('sales_report') }}">Sales Report</a>
</nav>

    </header>

    <main class="main-content">

        {% for message in get_flashed_messages() %}
            <div class="flash-message">{{ message }}</div>
        {% endfor %}

        {% block content %}{% endblock %}

    </main>

    <footer class="main-footer">
        <h3>🛒 ShopMate</h3>
        <p>Smarter Store. Fresher Choices.</p>
        <small>© 2026 ShopMate. All rights reserved.</small>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
